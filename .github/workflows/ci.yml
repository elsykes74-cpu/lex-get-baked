name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # No env vars on purpose: this mirrors how Vercel builds and catches
      # module-scope secret usage (the Stripe build break of 2026-06-30).
      - run: npm run build
