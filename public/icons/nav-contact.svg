<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0d8d0"/>
      <stop offset="100%" stop-color="#c8bca8"/>
    </linearGradient>
    <linearGradient id="box" x1="20" y1="30" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c8b090"/>
      <stop offset="100%" stop-color="#9a7858"/>
    </linearGradient>
    <linearGradient id="post" x1="52" y1="80" x2="68" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b09878"/>
      <stop offset="100%" stop-color="#887058"/>
    </linearGradient>
    <linearGradient id="door" x1="60" y1="50" x2="88" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4b890"/>
      <stop offset="100%" stop-color="#b09060"/>
    </linearGradient>
    <linearGradient id="letter" x1="62" y1="38" x2="82" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#f0e4d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#705030" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Post/base -->
  <rect x="52" y="82" width="16" height="28" rx="4" fill="url(#post)" filter="url(#shadow)"/>
  <rect x="44" y="106" width="32" height="8" rx="4" fill="#807060"/>
  <!-- Mailbox body -->
  <rect x="18" y="44" width="72" height="44" rx="12 12 6 6" fill="url(#box)" filter="url(#shadow)"/>
  <!-- Mailbox dome top -->
  <ellipse cx="54" cy="44" rx="36" ry="12" fill="url(#box)"/>
  <!-- Front door / slot area -->
  <rect x="58" y="52" width="26" height="28" rx="6" fill="url(#door)"/>
  <!-- Mail slot -->
  <rect x="62" y="68" width="18" height="4" rx="2" fill="#7a5838"/>
  <!-- Flag -->
  <rect x="88" y="34" width="4" height="28" rx="2" fill="#a88060"/>
  <rect x="88" y="34" width="18" height="12" rx="3" fill="#e85040"/>
  <!-- Letter sticking out -->
  <rect x="62" y="38" width="20" height="28" rx="3" fill="url(#letter)" filter="url(#shadow)" transform="rotate(-8 72 52)"/>
  <!-- Letter lines -->
  <line x1="65" y1="46" x2="78" y2="44" stroke="#c4a882" stroke-width="1.5" stroke-linecap="round" transform="rotate(-8 72 52)"/>
  <line x1="65" y1="52" x2="78" y2="50" stroke="#c4a882" stroke-width="1.5" stroke-linecap="round" transform="rotate(-8 72 52)"/>
  <!-- Wax seal -->
  <circle cx="76" cy="60" r="5" fill="#cc3030" transform="rotate(-8 72 52)"/>
  <text x="74" y="63" font-size="6" fill="white" font-family="serif" transform="rotate(-8 76 60)">L</text>
  <!-- Highlight on top -->
  <ellipse cx="54" cy="36" rx="28" ry="6" fill="white" opacity="0.2"/>
</svg>
