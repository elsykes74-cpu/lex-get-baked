<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8e0d8"/>
      <stop offset="100%" stop-color="#d0c4b0"/>
    </linearGradient>
    <linearGradient id="frame" x1="15" y1="30" x2="105" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#a88060"/>
    </linearGradient>
    <linearGradient id="basket" x1="30" y1="50" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dcc8a8"/>
      <stop offset="100%" stop-color="#c4a07a"/>
    </linearGradient>
    <linearGradient id="box" x1="40" y1="42" x2="90" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5e8d8"/>
      <stop offset="100%" stop-color="#e0c8a0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#806040" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Handle -->
  <path d="M15,30 Q15,18 28,18 L36,18" stroke="url(#frame)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#shadow)"/>
  <!-- Basket body -->
  <path d="M28,38 L36,80 Q37,88 46,88 L90,88 Q98,88 99,80 L104,48 Q105,38 95,38 Z" fill="url(#basket)" filter="url(#shadow)"/>
  <!-- Basket grid lines -->
  <line x1="52" y1="38" x2="48" y2="88" stroke="#b88060" stroke-width="1.5" opacity="0.4"/>
  <line x1="68" y1="38" x2="68" y2="88" stroke="#b88060" stroke-width="1.5" opacity="0.4"/>
  <line x1="84" y1="38" x2="88" y2="88" stroke="#b88060" stroke-width="1.5" opacity="0.4"/>
  <line x1="30" y1="56" x2="102" y2="56" stroke="#b88060" stroke-width="1.5" opacity="0.4"/>
  <line x1="32" y1="72" x2="101" y2="72" stroke="#b88060" stroke-width="1.5" opacity="0.4"/>
  <!-- Parcel in cart -->
  <rect x="44" y="40" width="46" height="36" rx="5" fill="url(#box)"/>
  <line x1="67" y1="40" x2="67" y2="76" stroke="#e890b0" stroke-width="3"/>
  <line x1="44" y1="58" x2="90" y2="58" stroke="#e890b0" stroke-width="3"/>
  <!-- Wheels -->
  <circle cx="50" cy="97" r="9" fill="url(#frame)" filter="url(#shadow)"/>
  <circle cx="50" cy="97" r="5" fill="#d4b896"/>
  <circle cx="50" cy="97" r="2" fill="#a88060"/>
  <circle cx="86" cy="97" r="9" fill="url(#frame)" filter="url(#shadow)"/>
  <circle cx="86" cy="97" r="5" fill="#d4b896"/>
  <circle cx="86" cy="97" r="2" fill="#a88060"/>
  <!-- Cart handle top -->
  <path d="M28,38 L95,38" stroke="url(#frame)" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
