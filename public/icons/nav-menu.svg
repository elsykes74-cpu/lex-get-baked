<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8d5b8"/>
      <stop offset="100%" stop-color="#c9a87c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdf8f0"/>
      <stop offset="100%" stop-color="#f0e4cc"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="40" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9a87c"/>
      <stop offset="100%" stop-color="#9c7040"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7a5030" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Left cover -->
  <path d="M18,24 L58,18 L58,102 L18,108 Z" fill="url(#cover)" filter="url(#shadow)"/>
  <!-- Right cover -->
  <path d="M62,18 L102,24 L102,108 L62,102 Z" fill="url(#cover)" filter="url(#shadow)"/>
  <!-- Left page -->
  <path d="M22,28 L56,22 L56,98 L22,104 Z" fill="url(#page)"/>
  <!-- Right page -->
  <path d="M64,22 L98,28 L98,104 L64,98 Z" fill="url(#page)"/>
  <!-- Spine -->
  <rect x="56" y="18" width="8" height="84" rx="2" fill="#8b6040"/>
  <!-- Left text lines -->
  <line x1="30" y1="40" x2="52" y2="38" stroke="#c4a882" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="50" x2="52" y2="48" stroke="#c4a882" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="58" x2="52" y2="57" stroke="#c4a882" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="66" x2="52" y2="65" stroke="#c4a882" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="74" x2="52" y2="73" stroke="#c4a882" stroke-width="2" stroke-linecap="round"/>
  <!-- Right text lines -->
  <line x1="68" y1="38" x2="90" y2="40" stroke="#c4a882" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="48" x2="90" y2="50" stroke="#c4a882" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="57" x2="90" y2="58" stroke="#c4a882" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="65" x2="90" y2="66" stroke="#c4a882" stroke-width="2" stroke-linecap="round"/>
  <line x1="68" y1="73" x2="90" y2="74" stroke="#c4a882" stroke-width="2" stroke-linecap="round"/>
  <!-- Gold emboss dots on covers -->
  <circle cx="38" cy="88" r="3" fill="#e8c870" opacity="0.8"/>
  <circle cx="82" cy="88" r="3" fill="#e8c870" opacity="0.8"/>
</svg>
