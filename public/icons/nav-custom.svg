<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0e0d0"/>
      <stop offset="100%" stop-color="#dcc8b0"/>
    </linearGradient>
    <linearGradient id="box" x1="20" y1="50" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5e8d8"/>
      <stop offset="100%" stop-color="#dcc8a8"/>
    </linearGradient>
    <linearGradient id="lid" x1="20" y1="36" x2="100" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f9f0e4"/>
      <stop offset="100%" stop-color="#e8d4b8"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8b4c8"/>
      <stop offset="100%" stop-color="#c87898"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#806040" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Box body -->
  <rect x="20" y="60" width="80" height="50" rx="6" fill="url(#box)" filter="url(#shadow)"/>
  <!-- Box lid -->
  <rect x="16" y="38" width="88" height="26" rx="6" fill="url(#lid)" filter="url(#shadow)"/>
  <!-- Vertical ribbon on box -->
  <rect x="55" y="60" width="10" height="50" fill="url(#ribbon)" opacity="0.8"/>
  <!-- Horizontal ribbon on lid -->
  <rect x="16" y="48" width="88" height="10" fill="url(#ribbon)" opacity="0.8"/>
  <!-- Ribbon cross on lid -->
  <rect x="55" y="38" width="10" height="26" fill="url(#ribbon)" opacity="0.9"/>
  <!-- Bow left loop -->
  <ellipse cx="46" cy="34" rx="16" ry="10" fill="#f0c8d8" stroke="#e890b0" stroke-width="1.5" transform="rotate(-20 46 34)"/>
  <!-- Bow right loop -->
  <ellipse cx="74" cy="34" rx="16" ry="10" fill="#f0c8d8" stroke="#e890b0" stroke-width="1.5" transform="rotate(20 74 34)"/>
  <!-- Bow center knot -->
  <ellipse cx="60" cy="36" rx="8" ry="7" fill="#e890b0"/>
  <!-- Bow tails -->
  <path d="M52,40 Q44,52 38,58" stroke="#e890b0" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M68,40 Q76,52 82,58" stroke="#e890b0" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Highlight on lid -->
  <rect x="20" y="40" width="84" height="8" rx="4" fill="white" opacity="0.3"/>
</svg>
