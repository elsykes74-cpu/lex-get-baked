<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5e6d0"/>
      <stop offset="100%" stop-color="#e8d5b8"/>
    </linearGradient>
    <linearGradient id="wall" x1="30" y1="50" x2="90" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f9f0e3"/>
      <stop offset="100%" stop-color="#e8d5b8"/>
    </linearGradient>
    <linearGradient id="roof" x1="20" y1="20" x2="100" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4a882"/>
      <stop offset="100%" stop-color="#a07850"/>
    </linearGradient>
    <linearGradient id="glow" x1="50" y1="70" x2="70" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe8a0"/>
      <stop offset="100%" stop-color="#ffc840"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#8b6040" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- House body -->
  <rect x="28" y="58" width="64" height="52" rx="6" fill="url(#wall)" filter="url(#shadow)"/>
  <!-- Roof -->
  <polygon points="20,62 60,22 100,62" fill="url(#roof)" filter="url(#shadow)"/>
  <polygon points="20,62 60,22 100,62" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="50" y="82" width="20" height="28" rx="10 10 4 4" fill="url(#glow)"/>
  <circle cx="67" cy="97" r="2" fill="#a07850"/>
  <!-- Windows -->
  <rect x="32" y="68" width="18" height="14" rx="4" fill="url(#glow)" opacity="0.9"/>
  <rect x="70" y="68" width="18" height="14" rx="4" fill="url(#glow)" opacity="0.9"/>
  <!-- Chimney -->
  <rect x="72" y="30" width="12" height="22" rx="3" fill="#c4a882"/>
  <!-- Snow/frosting on roof -->
  <path d="M24,62 Q60,24 96,62" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
